    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MobileApplication",
      "name": "Assam Land Records – Dharitre",
      "alternateName": ["অসম ভূমি অভিলেখ — ধৰিত্ৰী", "असम भूमि अभिलेख – धरीत्री"],
      "operatingSystem": "Android",
      "applicationCategory": "UtilitiesApplication",
      "inLanguage": ["en", "as"],
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
      "description": "Assam Land Records – Dharitre: unofficial companion app for Assam Dharitree (ILRMS). Search land records, convert bigha/katha/lecha, Mission Basundhara, Bhunaksha, government schemes, Assam weather and news.",
      "image": "https://dharitree.app/app-logo.webp",
      "about": [
        { "@type": "Thing", "name": "Jamabandi" },
        { "@type": "Thing", "name": "Patta & Dag" },
        { "@type": "Thing", "name": "Mission Basundhara" },
        { "@type": "Thing", "name": "Bhunaksha" },
        { "@type": "Thing", "name": "e-Khajana" }
      ],
      "areaServed": { "@type": "AdministrativeArea", "name": "Assam, India" },
      "isAccessibleForFree": true
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Assam Land Records – Dharitre",
      "url": "https://dharitree.app/",
      "inLanguage": "en",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://dharitree.app/#/land-search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "How do I check my land record in Assam?",
          "acceptedAnswer": { "@type": "Answer", "text": "Pick your district, revenue circle and village in the app and enter the dag/patta number. The app forwards your request to the official Dharitree portal, you solve the CAPTCHA, and the jamabandi is shown natively." } },
        { "@type": "Question", "name": "What is Dharitree?",
          "acceptedAnswer": { "@type": "Answer", "text": "Dharitree is the Government of Assam online land-records system hosted under ILRMS at ilrms.assam.gov.in/dhar." } },
        { "@type": "Question", "name": "What is 1 bigha in Assam?",
          "acceptedAnswer": { "@type": "Answer", "text": "In Assam, 1 bigha = 5 katha = 100 lecha = 14,400 square feet ≈ 0.33 acre ≈ 1,337.8 square metres." } }
      ]
    }
    </script>
